  <!-- JAVASCRIPT LOGIC ENGINE -->
  <script>
    var BACKEND_SERVER_URL = "http://localhost:5000";
    var MAIN_SHEET_ID = '1Yn5KllO-wCu3eKRfTNaI-EzUl1b29pDXsgLQ03BrzAw';
    var SHEET_URL_ALERT = 'https://docs.google.com/spreadsheets/d/' + MAIN_SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=alram2622';
    var SHEET_URL_NOTICES = 'https://docs.google.com/spreadsheets/d/' + MAIN_SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=notices';
    var SHEET_URL_DDAYS = 'https://docs.google.com/spreadsheets/d/' + MAIN_SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=ddays';
    var REGULAR_TIMETABLE_SHEET_ID = '1yfOSkEkHqoWG2bRLj10Wd0ns9M_Rs8n9KxP7VNthyto';
    var SHEET_URL_REGULAR = 'https://docs.google.com/spreadsheets/d/' + REGULAR_TIMETABLE_SHEET_ID + '/gviz/tq?tqx=out:csv';
    var AFTER_SCHOOL_SHEET_ID = '13_kWSLwjIynNBEfQAfw2sQkkBBN5Zy9aqvWIOe7bmg4';
    
    var selectedDay = 1; // 1:월, 2:화, 3:수, 4:목, 5:금, 6:토
    var currentDateForMeal = new Date();
    var regularTimetableData = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
    var rawAfterschoolCSV = null;
    var lastDismissedAlertText = "";

    var SCHEDULE_PERIODS = [
      { name: "아침 조례", start: "08:40", end: "08:50", type: "homeroom" },
      { name: "1교시", start: "09:00", end: "09:50", period: 1 },
      { name: "2교시", start: "10:00", end: "10:50", period: 2 },
      { name: "3교시", start: "11:00", end: "11:50", period: 3 },
      { name: "4교시", start: "12:00", end: "12:50", period: 4 },
      { name: "점심 시간", start: "12:50", end: "13:40", type: "lunch" },
      { name: "5교시", start: "13:40", end: "14:30", period: 5 },
      { name: "6교시", start: "14:40", end: "15:30", period: 6 },
      { name: "7교시", start: "15:40", end: "16:30", period: 7 },
      { name: "8교시", start: "16:40", end: "17:30", period: 8 },
      { name: "9교시", start: "18:10", end: "19:00", period: 9 },
      { name: "10교시", start: "19:10", end: "20:00", period: 10 },
      { name: "11교시", start: "20:10", end: "21:00", period: 11 }
    ];

    // 이름 뒤에 무조건 ' 선생님'을 붙여주는 기능
    function formatTeacher(name) {
      if (!name) return '';
      let t = String(name).trim();
      if (t !== '' && !t.endsWith('선생님') && !t.endsWith('교사') && t !== '급식실' && t !== '지도교사') {
        return t + ' 선생님';
      }
      return t;
    }

    function splitSubjectAndTeacher(rawText) {
      if (!rawText) return { subject: '', teacher: '' };
      let text = String(rawText).trim();
      let parts = text.split(/\s+/);
      if (parts.length >= 2) {
        let teacher = parts.pop();
        let subject = parts.join(' ');
        return { subject: subject, teacher: formatTeacher(teacher) };
      }
      return { subject: text, teacher: '' };
    }

    function parseCSV(text) {
      var p = '', row = [''], ret = [row];
      var i = 0, r = 0, s = true, l;
      for (var idx = 0; idx < text.length; idx++) {
        l = text[idx];
        if ('"' === l) {
          if (s && l === p) row[i] += l;
          s = !s;
        } else if (',' === l && s) { l = row[++i] = ''; } 
        else if ('\n' === l && s) {
          if ('\r' === p) row[i] = row[i].slice(0, -1);
          row = [l = '']; ret[++r] = row; i = 0;
        } else { row[i] += l; }
        p = l;
      }
      return ret;
    }

    async function loadRegularTimetable() {
      const badge = document.getElementById('timetable-source-badge');
      badge.innerText = "연결 중...";
      badge.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-slate-700 text-slate-300 border border-slate-600";

      // 1순위: 컴시간 파이썬 서버 API
      try {
        const res = await fetch(BACKEND_SERVER_URL + '/api/timetable?_t=' + Date.now());
        if (res.ok) {
          const json = await res.json();
          if (json.success && json.data) {
            parseComciPayload(json.data);
            badge.innerText = "컴시간알리미";
            badge.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-sky-500/20 text-sky-300 border border-sky-500/30";
            renderTimetables();
            return;
          }
        }
      } catch (e) {}
      
      // 2순위: 교육부 NEIS API
      try {
        const now = new Date();
        const monday = new Date(now);
        monday.setDate(now.getDate() - (now.getDay() || 7) + 1);
        const friday = new Date(monday);
        friday.setDate(monday.getDate() + 4);

        const fromYmd = monday.getFullYear() + String(monday.getMonth() + 1).padStart(2, '0') + String(monday.getDate()).padStart(2, '0');
        const toYmd = friday.getFullYear() + String(friday.getMonth() + 1).padStart(2, '0') + String(friday.getDate()).padStart(2, '0');

        const neisUrl = `https://open.neis.go.kr/hub/hisTimetable?Type=json&ATPT_OFCDC_SC_CODE=K10&SD_SCHUL_CODE=7801228&AY=${now.getFullYear()}&SEM=2&GRADE=2&CLASS_NM=2&TI_FROM_YMD=${fromYmd}&TI_TO_YMD=${toYmd}`;
        
        const neisRes = await fetch(neisUrl);
        if (neisRes.ok) {
          const json = await neisRes.json();
          if (json.hisTimetable && json.hisTimetable[1].row) {
            parseNeisTimetable(json.hisTimetable[1].row);
            badge.innerText = "NEIS 연동";
            badge.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
            renderTimetables();
            return;
          }
        }
      } catch (e) {}

      // 3순위: 구글 시트 백업
      try {
        const sheetRes = await fetch(SHEET_URL_REGULAR + '&_nocache=' + Date.now());
        if (sheetRes.ok) {
          const text = await sheetRes.text();
          parseRegularSheet(text);
          badge.innerText = "저장된 시간표";
          badge.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30";
          renderTimetables();
        }
      } catch (e) {
        badge.innerText = "연결 실패";
        badge.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30";
      }
    }

    function parseComciPayload(dataObj) {
      regularTimetableData = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
      for (let d = 1; d <= 5; d++) {
        let dayList = dataObj[d] || dataObj[String(d)] || [];
        dayList.forEach((item, idx) => {
          if (item.subject) {
            regularTimetableData[d].push({ 
              period: item.period || (idx + 1), 
              subject: item.subject, 
              teacher: formatTeacher(item.teacher)
            });
          }
        });
      }
    }

    function parseNeisTimetable(rows) {
      regularTimetableData = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
      rows.forEach(r => {
        let ymd = r.ALL_TI_YMD;
        if (ymd && r.ITRT_CNT && r.ITRT_CNT_NM) {
          let dateObj = new Date(ymd.substring(0, 4), parseInt(ymd.substring(4, 6)) - 1, ymd.substring(6, 8));
          let dayIndex = dateObj.getDay();
          let parsed = splitSubjectAndTeacher(r.ITRT_CNT_NM);
          if (dayIndex >= 1 && dayIndex <= 5 && parsed.subject) {
            regularTimetableData[dayIndex].push({ period: parseInt(r.ITRT_CNT), subject: parsed.subject, teacher: parsed.teacher });
          }
        }
      });
      for (let d = 1; d <= 5; d++) {
        regularTimetableData[d].sort((a, b) => a.period - b.period);
      }
    }

    function parseRegularSheet(csvText) {
      const rows = parseCSV(csvText);
      regularTimetableData = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
      let foundHeaderRow = -1;
      for (let r = 0; r < rows.length; r++) {
        let line = rows[r].join(',');
        if (line.includes('월') && line.includes('화')) { foundHeaderRow = r; break; }
      }
      if (foundHeaderRow !== -1) {
        for (let p = 1; p <= 7; p++) {
          let rIdx = foundHeaderRow + p;
          if (rows[rIdx]) {
            for (let d = 1; d <= 5; d++) {
              let val = rows[rIdx][d] ? rows[rIdx][d].trim() : '';
              if (val) {
                let parsed = splitSubjectAndTeacher(val);
                regularTimetableData[d].push({ period: p, subject: parsed.subject, teacher: parsed.teacher });
              }
            }
          }
        }
      }
    }

    async function loadAfterschoolTimetable() {
      var now = new Date();
      var currentMonth = now.getMonth() + 1;
      var GIDS = { 9: '754589259', 10: '987912871', 11: '212747753', 12: '119730049', 1: '609021176' };
      var gid = GIDS[currentMonth] || GIDS[9];
      var url = 'https://docs.google.com/spreadsheets/d/' + AFTER_SCHOOL_SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + gid + '&_nocache=' + Date.now();
      try {
        const res = await fetch(url);
        if (res.ok) {
          rawAfterschoolCSV = parseCSV(await res.text());
          renderTimetables();
        }
      } catch (e) {}
    }

    // 💡 방과후학교: 월요일은 고정, 화~토는 구글 시트 연동
    function getAfterschoolList(dayIndex) {
      if (dayIndex === 1) { 
        return [
          { period: 8, subject: "TOEIC/한국사", teacher: "" },
          { period: 9, subject: "TOEIC/한국사", teacher: "" },
          { period: 10, subject: "TOEIC/한국사", teacher: "" },
          { period: 11, subject: "TOEIC/한국사", teacher: "" }
        ];
      }

      if (!rawAfterschoolCSV || rawAfterschoolCSV.length === 0) return [];
      
      var rows = rawAfterschoolCSV;
      var week = Math.min(5, Math.max(1, Math.ceil(new Date().getDate() / 7)));
      var COL_MAP = { 2: 14, 3: 23, 4: 32, 5: 41, 6: 50 }; // O, X, AG, AP, AY
      var rowMap = {
        1: [11, 13, 14, 15], 2: [27, 29, 30, 31], 3: [43, 45, 46, 47], 4: [59, 61, 62, 63], 5: [75, 77, 78, 79]
      };
      var tRows = rowMap[week] || rowMap[1];
      var list = [];

      if (dayIndex >= 2 && dayIndex <= 5) {
        let col = COL_MAP[dayIndex];
        tRows.forEach((rIdx, idx) => {
          let val = (rows[rIdx] && rows[rIdx][col]) ? rows[rIdx][col].trim() : '';
          if (val) {
             let parsed = splitSubjectAndTeacher(val);
             list.push({ period: 8 + idx, subject: parsed.subject, teacher: parsed.teacher });
          }
        });
      } else if (dayIndex === 6) {
        var satRowMap = {
          1: [3, 4, 5, 6, 8, 9, 10, 11], 2: [19, 20, 21, 22, 24, 25, 26, 27],
          3: [35, 36, 37, 38, 40, 41, 42, 43], 4: [51, 52, 53, 54, 56, 57, 58, 59],
          5: [67, 68, 69, 70, 72, 73, 74, 75]
        };
        var satRows = satRowMap[week] || satRowMap[4];
        let col = COL_MAP[6];
        satRows.forEach((rIdx, idx) => {
          let val = (rows[rIdx] && rows[rIdx][col]) ? rows[rIdx][col].trim() : '';
          if (val) {
             let parsed = splitSubjectAndTeacher(val);
             list.push({ period: idx + 1, subject: parsed.subject, teacher: parsed.teacher });
          }
        });
      }
      return list;
    }

    function selectDay(dayIdx) {
      selectedDay = dayIdx; // 정수 (1~6)
      
      document.querySelectorAll('.day-tab-btn').forEach((btn, idx) => {
        if ((idx + 1) === dayIdx) btn.classList.add('active-day-btn');
        else btn.classList.remove('active-day-btn');
      });

      // 급식 날짜 오프셋 조정
      let today = new Date();
      let todayIdx = today.getDay() === 0 ? 7 : today.getDay(); 
      let targetIdx = dayIdx === 0 ? 7 : dayIdx;
      currentDateForMeal = new Date(today);
      currentDateForMeal.setDate(today.getDate() + (targetIdx - todayIdx));

      renderTimetables();
      fetchMealsForDate();
    }

    function renderTimetables() {
      const regContainer = document.getElementById('regular-timetable-container');
      const aftContainer = document.getElementById('afterschool-timetable-container');

      if (regContainer) {
        if (selectedDay === 6) { 
          regContainer.innerHTML = `
            <div class="p-6 text-center text-slate-400 glass-card">
              <i class="fa-solid fa-mug-hot text-2xl text-amber-400 mb-2"></i>
              <div class="font-bold text-sm text-slate-300">토요일은 정규 수업이 없습니다.</div>
              <div class="text-xs text-slate-500 mt-1">방과후학교 수업을 확인하세요.</div>
            </div>`;
        } else {
          let regList = regularTimetableData[selectedDay] || [];
          if (regList.length === 0) {
            regContainer.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">데이터 연결 중 또는 일정이 없습니다.</div>`;
          } else {
            regContainer.innerHTML = regList.map(item => `
              <div class="glass-card p-3 flex items-center justify-between border-l-4 border-l-sky-400 hover:bg-slate-800/60 transition">
                <span class="text-xs font-bold text-sky-300 w-14">${item.period}교시</span>
                <span class="text-sm font-extrabold text-white flex-1 mx-2">${item.subject}</span>
                <span class="text-xs text-slate-400">${item.teacher}</span>
              </div>
            `).join('');
          }
        }
      }

      if (aftContainer) {
        let aftList = getAfterschoolList(selectedDay);
        if (aftList.length === 0) {
          aftContainer.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">방과후 일정이 없습니다.</div>`;
        } else {
          aftContainer.innerHTML = aftList.map(item => `
            <div class="glass-card p-3 flex items-center justify-between border-l-4 border-l-amber-400 hover:bg-slate-800/60 transition">
              <span class="text-xs font-bold text-amber-300 w-14">${item.period}교시</span>
              <span class="text-sm font-extrabold text-white flex-1 mx-2">${item.subject}</span>
              <span class="text-xs text-slate-400">${item.teacher || ''}</span>
            </div>
          `).join('');
        }
      }
    }

    function fetchMealsForDate() {
      const year = currentDateForMeal.getFullYear();
      const month = String(currentDateForMeal.getMonth() + 1).padStart(2, '0');
      const date = String(currentDateForMeal.getDate()).padStart(2, '0');
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      
      document.getElementById('meal-date-display').innerText = `${year}.${month}.${date} (${days[currentDateForMeal.getDay()]})`;

      const neisUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=10&ATPT_OFCDC_SC_CODE=K10&SD_SCHUL_CODE=7801228&MLSV_YMD=${year}${month}${date}`;

      fetch(neisUrl)
        .then(res => res.json())
        .then(data => {
          let m = { b: "급식 정보 없음", l: "급식 정보 없음", d: "급식 정보 없음" };
          if (data.mealServiceDietInfo && data.mealServiceDietInfo[1].row) {
            data.mealServiceDietInfo[1].row.forEach(r => {
              let clean = r.DDISH_NM.replace(/<br\/>/g, '\n').replace(/\([0-9\.]+\)/g, '').trim();
              if (r.MMEAL_SC_CODE === '1') m.b = clean;
              if (r.MMEAL_SC_CODE === '2') m.l = clean;
              if (r.MMEAL_SC_CODE === '3') m.d = clean;
            });
          }
          renderMeals(m);
        })
        .catch(() => renderMeals({ b: "연동 실패", l: "연동 실패", d: "연동 실패" }));
    }

    function renderMeals(meals) {
      const container = document.getElementById('meals-container');
      const now = new Date();
      const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const isToday = (currentDateForMeal.toDateString() === now.toDateString());
      
      const bActive = isToday && (currentHM <= "08:40");
      const lActive = isToday && (currentHM > "08:40" && currentHM <= "13:40");
      const dActive = isToday && (currentHM > "13:40" && currentHM <= "18:10");

      container.innerHTML = `
        <div class="glass-card p-3.5 border-l-4 transition-all duration-300 ${bActive ? 'border-l-emerald-400 bg-emerald-950/40 shadow-lg ring-1 ring-emerald-500/20' : 'border-l-slate-600 opacity-85'}">
          <span class="text-xs font-bold ${bActive ? 'text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-500/30' : 'text-slate-400'}">🌅 조식 ${bActive ? '(진행 중)' : ''}</span>
          <p class="text-xs font-medium text-slate-200 mt-1.5 whitespace-pre-line">${meals.b}</p>
        </div>
        <div class="glass-card p-3.5 border-l-4 transition-all duration-300 mt-3 ${lActive ? 'border-l-emerald-400 bg-emerald-950/40 shadow-lg ring-1 ring-emerald-500/20' : 'border-l-slate-600 opacity-85'}">
          <span class="text-xs font-bold ${lActive ? 'text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-500/30' : 'text-slate-400'}">☀️ 중식 ${lActive ? '(진행 중)' : ''}</span>
          <p class="text-xs font-medium text-slate-200 mt-1.5 whitespace-pre-line">${meals.l}</p>
        </div>
        <div class="glass-card p-3.5 border-l-4 transition-all duration-300 mt-3 ${dActive ? 'border-l-emerald-400 bg-emerald-950/40 shadow-lg ring-1 ring-emerald-500/20' : 'border-l-slate-600 opacity-85'}">
          <span class="text-xs font-bold ${dActive ? 'text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-500/30' : 'text-slate-400'}">🌙 석식 ${dActive ? '(진행 중)' : ''}</span>
          <p class="text-xs font-medium text-slate-200 mt-1.5 whitespace-pre-line">${meals.d}</p>
        </div>
      `;
    }

    function changeMealDate(offset) {
      if (offset === 0) currentDateForMeal = new Date();
      else currentDateForMeal.setDate(currentDateForMeal.getDate() + offset);
      
      let targetDayIdx = currentDateForMeal.getDay();
      if (targetDayIdx === 0) targetDayIdx = 1; // 일요일은 월요일로 강제 포커스
      selectDay(targetDayIdx); 
    }

    async function fetchNotices() {
      try {
        const res = await fetch(SHEET_URL_NOTICES + '&_nocache=' + Date.now());
        if (res.ok) {
          const rows = parseCSV(await res.text());
          const c = document.getElementById('notices-list');
          if (rows.length > 1) {
            c.innerHTML = rows.slice(1).map(r => {
              if(!r[1]) return '';
              let isImp = r[0].includes('중요');
              let badge = isImp ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-sky-500/20 text-sky-300 border border-sky-500/30';
              return `<div class="glass-card p-2.5 flex items-center text-xs"><span class="px-2 py-0.5 rounded font-bold mr-2 ${badge} shrink-0">${r[0]}</span><span class="text-white truncate">${r[1]}</span></div>`;
            }).join('');
          }
        }
      } catch (e) {}
    }

    async function fetchDDays() {
      try {
        const res = await fetch(SHEET_URL_DDAYS + '&_nocache=' + Date.now());
        if (res.ok) {
          const rows = parseCSV(await res.text());
          const c = document.getElementById('ddays-list');
          if (rows.length > 1) {
            const today = new Date(); today.setHours(0,0,0,0);
            c.innerHTML = rows.slice(1).map(r => {
              if(!r[0]) return '';
              let t = new Date(r[1]); t.setHours(0,0,0,0);
              let diff = Math.ceil((t - today) / (1000 * 60 * 60 * 24));
              let dDayStr = diff === 0 ? "D-Day" : diff > 0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
              return `
                <div class="glass-card p-3 flex justify-between items-center border-l-4 border-l-amber-400">
                  <div>
                    <div class="text-xs font-bold text-white">${r[0]}</div>
                    <div class="text-[10px] text-slate-400 mt-0.5">${r[1]}</div>
                  </div>
                  <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 font-mono font-black text-xs">${dDayStr}</span>
                </div>`;
            }).join('');
          }
        }
      } catch (e) {}
    }
    
    async function pollGoogleSheetAlerts() {
      try {
        var res = await fetch(SHEET_URL_ALERT + '&_nocache=' + Date.now());
        if (res.ok) {
          var rows = parseCSV(await res.text());
          if (rows.length >= 2) {
            var activeVal = (rows[1][0] || '').trim().toUpperCase();
            var isActive = (activeVal === 'TRUE' || activeVal === '1' || activeVal === 'Y');
            var title = rows[1][1] || '교무실 긴급 전달사항';
            var message = rows[1][2] || '';
            var alertKey = title + '::' + message;

            var modal = document.getElementById('urgent-modal');
            if (isActive && message.trim() !== '') {
              if (lastDismissedAlertText !== alertKey) {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                modal.classList.remove('hidden');
              }
            } else {
              modal.classList.add('hidden');
              lastDismissedAlertText = '';
            }
          }
        }
      } catch (e) {}
      setTimeout(pollGoogleSheetAlerts, 5000); // 5초 주기 스캔
    }

    function dismissAlert() {
      var title = document.getElementById('modal-title').innerText;
      var message = document.getElementById('modal-message').innerText;
      lastDismissedAlertText = title + '::' + message;
      document.getElementById('urgent-modal').classList.add('hidden');
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock-date').textContent = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' (' + ['일','월','화','수','목','금','토'][now.getDay()] + ')요일';
      
      let currentHM = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      let statusText = "일과 외 시간";
      let subjText = "휴식 및 자율 학습";

      for (let p of SCHEDULE_PERIODS) {
        if (currentHM >= p.start && currentHM <= p.end) {
          statusText = `현재 ${p.name} 진행 중`;
          subjText = p.name + " (" + p.start + "~" + p.end + ")";
          break;
        }
      }
      document.getElementById('active-period-badge').innerText = statusText;
      document.getElementById('live-subject-title').innerText = subjText;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e=>{});
      else if (document.exitFullscreen) document.exitFullscreen();
    }

    window.onload = function() {
      setInterval(updateClock, 1000);
      updateClock();

      // 💡 접속 시 오늘 요일 자동 탭 포커스 (일요일은 월요일로)
      let todayIdx = new Date().getDay();
      if (todayIdx === 0) todayIdx = 1; 
      selectDay(todayIdx);

      // 데이터 로드
      loadRegularTimetable();
      loadAfterschoolTimetable();
      fetchNotices();
      fetchDDays();
      pollGoogleSheetAlerts();
    };
  </script>
</body>
</html>
