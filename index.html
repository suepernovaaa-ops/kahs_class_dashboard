        lunch: "찰보리밥, 마라탕(순한맛), 꿔바로우탕수육, 짜사이무침, 깍두기, 아이스크림",
        dinner: "주말 자율 귀가 / 급식 미운영"
      }
    };

    const SCHEDULE_PERIODS = [
      { name: "아침 조례", start: "08:40", end: "08:50", type: "homeroom" },
      { name: "1교시", start: "09:00", end: "09:50", type: "regular", period: 1 },
      { name: "2교시", start: "10:00", end: "10:50", type: "regular", period: 2 },
      { name: "3교시", start: "11:00", end: "11:50", type: "regular", period: 3 },
      { name: "4교시", start: "12:00", end: "12:50", type: "regular", period: 4 },
      { name: "점심 시간", start: "12:50", end: "13:40", type: "lunch" },
      { name: "5교시", start: "13:40", end: "14:30", type: "regular", period: 5 },
      { name: "6교시", start: "14:40", end: "15:30", type: "regular", period: 6 },
      { name: "7교시", start: "15:40", end: "16:30", type: "regular", period: 7 },
      { name: "8교시", start: "16:40", end: "17:30", type: "afterschool", period: 8 },
      { name: "9교시", start: "18:10", end: "19:00", type: "afterschool", period: 9 },
      { name: "10교시", start: "19:10", end: "20:00", type: "afterschool", period: 10 },
      { name: "11교시", start: "20:10", end: "21:00", type: "afterschool", period: 11 }
    ];

    function changeDay(dayIndex) {
      selectedDay = dayIndex;
      const dayNames = { 1: "월요일", 2: "화요일", 3: "수요일", 4: "목요일", 5: "금요일" };

      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`day-btn-${i}`);
        if (btn) {
          if (i === dayIndex) {
            btn.className = "px-3 py-1 rounded-lg bg-sky-600 text-white shadow font-black";
          } else {
            btn.className = "px-3 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition font-bold";
          }
        }
      }

      const dayLabel = dayNames[dayIndex] || "오늘";
      document.getElementById('viewing-day-label').innerText = dayLabel;
      document.getElementById('meal-day-label').innerText = dayLabel;

      renderTimetable(WEEKLY_REGULAR_TIMETABLE[dayIndex] || []);
      renderAfterschool(WEEKLY_AFTERSCHOOL_TIMETABLE[dayIndex] || []);
      renderMeals(WEEKLY_MEALS[dayIndex]);
      updateHighlight();
    }

    function renderTimetable(list) {
      const container = document.getElementById('regular-timetable-list');
      container.innerHTML = '';
      list.forEach(item => {
        const row = document.createElement('div');
        row.id = `period-row-${item.period}`;
        row.className = "p-2 rounded-xl bg-slate-800/40 flex justify-between items-center border border-slate-700/30";
        row.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="px-2 py-0.5 text-xs font-black rounded bg-sky-500/20 text-sky-300 border border-sky-500/30">${item.period}교시</span>
            <span class="font-bold text-slate-100">${item.subject}</span>
          </div>
          <span class="text-xs text-slate-400 font-medium">${item.teacher}</span>
        `;
        container.appendChild(row);
      });
    }

    function renderAfterschool(list) {
      const container = document.getElementById('afterschool-timetable-list');
      container.innerHTML = '';
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-slate-500">방과후 일정이 없습니다.</div>';
        return;
      }
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = "p-2.5 rounded-xl bg-slate-800/50 flex justify-between items-center border border-slate-700/40";
        div.innerHTML = `
          <span class="font-bold text-amber-400">${item.period}교시</span>
          <span class="font-semibold text-slate-200">${item.subject}</span>
          <span class="text-xs text-slate-400">${item.teacher}</span>
        `;
        container.appendChild(div);
      });
    }

    function renderMeals(meals) {
      if (!meals) return;
      document.getElementById('meal-breakfast').innerText = meals.breakfast || "식단 정보 없음";
      document.getElementById('meal-lunch').innerText = meals.lunch || "식단 정보 없음";
      document.getElementById('meal-dinner').innerText = meals.dinner || "식단 정보 없음";
    }

    function updateClockAndStatus() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

      const days = ['일', '월', '화', '수', '목', '금', '토'];
      document.getElementById('date-display').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})요일`;

      const curTimeVal = `${hours}:${minutes}`;
      let activeIndex = -1;
      let statusTagText = "일과 외 시간";
      let subjectText = "자율 학습 및 휴식";

      for (let i = 0; i < SCHEDULE_PERIODS.length; i++) {
        const item = SCHEDULE_PERIODS[i];
        if (curTimeVal >= item.start && curTimeVal <= item.end) {
          statusTagText = `현재 ${item.name} 진행 중`;
          activeIndex = item.period || 0;
          
          const todayList = WEEKLY_REGULAR_TIMETABLE[now.getDay()] || [];
          const matchSubject = todayList.find(t => t.period === activeIndex);
          if (matchSubject) {
            subjectText = `${matchSubject.subject} (${matchSubject.teacher})`;
          } else {
            subjectText = `${item.name} (${item.start} ~ ${item.end})`;
          }
          break;
        }
      }

      document.getElementById('current-period-tag').innerText = statusTagText;
      document.getElementById('live-subject-text').innerText = subjectText;
      updateHighlight(activeIndex);
    }

    function updateHighlight(activePeriod) {
      const today = new Date().getDay();
      for (let p = 1; p <= 7; p++) {
        const el = document.getElementById(`period-row-${p}`);
        if (el) {
          if (selectedDay === today && p === activePeriod) {
            el.className = "p-2 rounded-xl active-period flex justify-between items-center transition duration-300";
          } else {
            el.className = "p-2 rounded-xl bg-slate-800/40 flex justify-between items-center border border-slate-700/30";
          }
        }
      }
    }

    // 구글 시트 긴급 알림 실시간 폴링 (3초 주기)
    async function pollGoogleSheetAlerts() {
      try {
        const res = await fetch(`${GOOGLE_SHEET_CSV_URL}&_nocache=${Date.now()}`);
        if (res.ok) {
          const text = await res.text();
          const rows = text.trim().split(/\r?\n/).map(r => r.split(',').map(c => c.replace(/^"|"$/g, '').trim()));
          
          if (rows.length >= 2) {
            const isActive = rows[1][0]?.toUpperCase() === 'TRUE';
            const title = rows[1][1] || '교무실 긴급 전달사항';
            const message = rows[1][2] || '';

            const modal = document.getElementById('urgent-modal');
            if (isActive && message) {
              document.getElementById('modal-title').innerText = title;
              document.getElementById('modal-message').innerText = message;
              modal.classList.remove('hidden');
            } else {
              modal.classList.add('hidden');
            }
          }
        }
      } catch (e) {
        console.error("구글 시트 연동 에러:", e);
      }
      setTimeout(pollGoogleSheetAlerts, 3000);
    }

    // [확인 완료] 클릭 시: 화면 닫기 + 구글 시트 active -> FALSE 자동 변경 요청
    async function dismissAlert() {
      document.getElementById('urgent-modal').classList.add('hidden');
      try {
        await fetch(`${GOOGLE_SCRIPT_WEBAPP_URL}?action=dismiss&_t=${Date.now()}`, {
          method: 'GET',
          mode: 'no-cors'
        });
        console.log("구글 시트 active 상태가 FALSE로 자동 변경되었습니다.");
      } catch (e) {
        console.error("시트 자동 업데이트 실패:", e);
      }
    }

    function loadNotices() {
      const list = JSON.parse(localStorage.getItem('kahs_notices') || '["2학년 2반 자율적인 운영과 역동적인 자치 실천", "실습실 이동 시 안전모 및 실습복 착용 필수"]');
      const container = document.getElementById('notice-container');
      container.innerHTML = '';
      list.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = "p-2.5 rounded-xl bg-slate-800/40 flex justify-between items-center border border-slate-700/30";
        div.innerHTML = `<span>📌 ${item}</span><button onclick="removeNotice(${idx})" class="text-xs text-slate-500 hover:text-red-400 ml-2">삭제</button>`;
        container.appendChild(div);
      });
    }

    function addNoticePrompt() {
      const text = prompt("새 공지사항을 입력하세요:");
      if (text && text.trim()) {
        const list = JSON.parse(localStorage.getItem('kahs_notices') || '[]');
        list.push(text.trim());
        localStorage.setItem('kahs_notices', JSON.stringify(list));
        loadNotices();
      }
    }

    function removeNotice(idx) {
      const list = JSON.parse(localStorage.getItem('kahs_notices') || '[]');
      list.splice(idx, 1);
      localStorage.setItem('kahs_notices', JSON.stringify(list));
      loadNotices();
    }

    function loadDDays() {
      const list = JSON.parse(localStorage.getItem('kahs_ddays') || '[{"title":"2학기 1차 지필평가","date":"2026-10-15"}]');
      const container = document.getElementById('dday-container');
      container.innerHTML = '';
      const today = new Date();
      today.setHours(0,0,0,0);

      list.forEach((item, idx) => {
        const target = new Date(item.date);
        target.setHours(0,0,0,0);
        const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        const ddayText = diffDays === 0 ? 'D-Day' : (diffDays > 0 ? `D-${diffDays}` : `D+${Math.abs(diffDays)}`);

        const div = document.createElement('div');
        div.className = "p-2.5 rounded-xl bg-slate-800/40 flex justify-between items-center border border-slate-700/30";
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 text-xs font-black rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">${ddayText}</span>
            <span class="font-semibold text-slate-200">${item.title}</span>
          </div>
          <button onclick="removeDDay(${idx})" class="text-xs text-slate-500 hover:text-red-400">삭제</button>
        `;
        container.appendChild(div);
      });
    }

    function addDDayPrompt() {
      const title = prompt("일정 명칭을 입력하세요 (예: 2학기 중간고사):");
      if (!title) return;
      const date = prompt("날짜를 입력하세요 (YYYY-MM-DD 형식):", "2026-10-15");
      if (title && date) {
        const list = JSON.parse(localStorage.getItem('kahs_ddays') || '[]');
        list.push({ title, date });
        localStorage.setItem('kahs_ddays', JSON.stringify(list));
        loadDDays();
      }
    }

    function removeDDay(idx) {
      const list = JSON.parse(localStorage.getItem('kahs_ddays') || '[]');
      list.splice(idx, 1);
      localStorage.setItem('kahs_ddays', JSON.stringify(list));
      loadDDays();
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function toggleMute() {
      alert("알림 음소거 상태가 설정되었습니다.");
    }

    window.onload = () => {
      changeDay(selectedDay);
      loadNotices();
      loadDDays();
      updateClockAndStatus();
      setInterval(updateClockAndStatus, 1000);
      pollGoogleSheetAlerts();
    };
  </script>
</body>
</html>
