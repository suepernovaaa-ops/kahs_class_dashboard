<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국항공고등학교 2학년 2반 스마트 대시보드</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },
            dark: { bg: '#0B1120', panel: '#1E293B', card: '#131B2F', border: '#334155' }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #0B1120;
      color: #F8FAFC;
      min-height: 100vh;
      margin: 0;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
  </style>
</head>
<body class="p-4 md:p-6 lg:p-8 flex flex-col gap-5">

  <!-- ================= HEADER ================= -->
  <header class="bg-[#1E293B] p-5 rounded-2xl border border-slate-700/50 shadow-lg flex flex-col md:flex-row items-center justify-between gap-6">
    <div class="flex items-center gap-5 z-10">
      <div class="w-14 h-14 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center shadow-inner">
        <i class="fa-solid fa-plane text-sky-400 text-2xl"></i>
      </div>
      <div>
        <div class="flex items-center gap-3 mb-1">
          <h1 class="text-2xl font-black text-white tracking-tight">
            한국항공고등학교 2학년 2반
          </h1>
          <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold flex items-center gap-1.5 shadow-[0_0_8px_rgba(16,185,129,0.3)]">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>라이브
          </span>
        </div>
        <p class="text-slate-400 text-sm font-medium">창공을 향한 비상, 대한민국 최고의 항공기술 인재!</p>
      </div>
    </div>

    <div class="flex items-center gap-6 z-10">
      <div class="text-right">
        <div id="clock" class="text-4xl md:text-5xl font-black text-white tracking-tighter font-mono">
          00:00:00
        </div>
        <div id="date" class="text-slate-400 text-sm font-bold mt-1">로딩 중...</div>
      </div>
    </div>
  </header>

  <!-- ================= NAVIGATION TABS ================= -->
  <div class="flex flex-col md:flex-row items-center justify-between gap-4 bg-[#1E293B] p-2 pl-5 rounded-2xl border border-slate-700/50 shadow-lg">
    <div class="flex items-center gap-3 text-sm">
      <span class="px-3 py-1 bg-sky-500/20 text-sky-400 font-black rounded-lg border border-sky-500/30 text-xs">LIVE CLASS STATUS</span>
      <span class="text-white font-bold bg-slate-800 px-3 py-1 rounded-lg border border-slate-700 flex items-center gap-2">
        <i class="fa-solid fa-chalkboard-user text-slate-400"></i> 등교 및 아침 자율시간
      </span>
      <span class="text-slate-300 font-bold ml-1 hidden md:block">오늘 하루도 활기차게 시작하세요! ✈️</span>
    </div>
    
    <div class="flex gap-1 bg-slate-900/50 p-1.5 rounded-xl border border-slate-700/50">
      <div class="px-3 py-1.5 text-xs font-black text-slate-400 flex items-center mr-1"><i class="fa-solid fa-calendar-day mr-1.5"></i>요일선택:</div>
      <button onclick="selectDay('월')" id="tab-월" class="day-tab w-10 py-1.5 rounded-lg text-sm font-bold text-slate-400 hover:text-white hover:bg-slate-700 transition">월</button>
      <button onclick="selectDay('화')" id="tab-화" class="day-tab w-10 py-1.5 rounded-lg text-sm font-bold text-slate-400 hover:text-white hover:bg-slate-700 transition">화</button>
      <button onclick="selectDay('수')" id="tab-수" class="day-tab w-10 py-1.5 rounded-lg text-sm font-bold text-slate-400 hover:text-white hover:bg-slate-700 transition">수</button>
      <button onclick="selectDay('목')" id="tab-목" class="day-tab w-10 py-1.5 rounded-lg text-sm font-bold text-slate-400 hover:text-white hover:bg-slate-700 transition">목</button>
      <button onclick="selectDay('금')" id="tab-금" class="day-tab w-10 py-1.5 rounded-lg text-sm font-bold text-slate-400 hover:text-white hover:bg-slate-700 transition">금</button>
    </div>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="grid grid-cols-1 lg:grid-cols-3 gap-5 h-full">
    
    <!-- 1. 정규 수업 -->
    <section class="bg-[#1E293B] p-6 rounded-2xl border border-slate-700/50 shadow-lg flex flex-col h-[420px]">
      <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-700/80">
        <h2 class="text-lg font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-calendar-days text-sky-400"></i> 정규 수업
        </h2>
        <span id="regular-status" class="px-2.5 py-1 rounded-md text-xs font-bold bg-slate-700 text-slate-300 border border-slate-600">
          로딩 중...
        </span>
      </div>
      <div id="regular-timetable-list" class="space-y-2.5 overflow-y-auto flex-1 pr-2">
        <div class="text-center text-slate-500 text-sm py-10">시간표 데이터를 불러오는 중입니다...</div>
      </div>
    </section>

    <!-- 2. 방과후학교 -->
    <section class="bg-[#1E293B] p-6 rounded-2xl border border-slate-700/50 shadow-lg flex flex-col h-[420px]">
      <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-700/80">
        <h2 class="text-lg font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-screwdriver-wrench text-amber-400"></i> 방과후학교
        </h2>
        <span id="afterschool-status" class="px-2.5 py-1 rounded-md text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">
          구글 시트 연동 <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-[10px]"></i>
        </span>
      </div>
      <div id="afterschool-timetable-list" class="space-y-2.5 overflow-y-auto flex-1 pr-2">
        <div class="text-center text-slate-500 text-sm py-10">방과후 일정을 로딩 중입니다...</div>
      </div>
    </section>

    <!-- 3. 식단표 -->
    <section class="bg-[#1E293B] p-6 rounded-2xl border border-slate-700/50 shadow-lg flex flex-col h-[420px]">
      <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-700/80">
        <h2 class="text-lg font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-utensils text-emerald-400"></i> 식단
        </h2>
        <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
          교육부 NEIS 실시간
        </span>
      </div>
      <div id="meal-content" class="flex-1 space-y-3 overflow-y-auto pr-2">
        <div class="text-center text-slate-500 text-sm py-10">급식 정보를 불러오는 중입니다...</div>
      </div>
      <!-- 식단 날짜 컨트롤러 -->
      <div class="mt-4 pt-3 border-t border-slate-700/80 flex items-center justify-between">
        <span id="meal-date-display" class="text-xs font-bold text-slate-400">날짜 연동 중...</span>
        <div class="flex gap-2">
          <button onclick="changeMealDate(-1)" class="px-2.5 py-1 rounded text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-700 transition"><i class="fa-solid fa-chevron-left mr-1"></i>어제</button>
          <button onclick="resetMealDate()" class="px-2.5 py-1 rounded text-xs font-bold text-emerald-400 hover:bg-emerald-500/20 transition">오늘</button>
          <button onclick="changeMealDate(1)" class="px-2.5 py-1 rounded text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-700 transition">내일<i class="fa-solid fa-chevron-right ml-1"></i></button>
        </div>
      </div>
    </section>

  </main>

  <!-- ================= BOTTOM PANELS ================= -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
    <!-- 공지사항 -->
    <section class="lg:col-span-2 bg-[#1E293B] p-6 rounded-2xl border border-slate-700/50 shadow-lg">
      <h2 class="text-lg font-black text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-bullhorn text-sky-400"></i> 공지 사항
      </h2>
      <div id="notice-list" class="space-y-2">
        <div class="text-slate-500 text-sm text-center py-4">공지사항을 불러오는 중...</div>
      </div>
    </section>

    <!-- 주요 일정 -->
    <section class="bg-[#1E293B] p-6 rounded-2xl border border-slate-700/50 shadow-lg">
      <h2 class="text-lg font-black text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-calendar-check text-amber-400"></i> 주요 일정
      </h2>
      <div id="dday-list" class="space-y-2">
        <div class="text-slate-500 text-sm text-center py-4">일정을 불러오는 중...</div>
      </div>
    </section>
  </div>

  <!-- ================= SCRIPTS ================= -->
  <script>
    const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1yfOSkEkHqoWG2bRLj10Wd0ns9M_Rs8n9KxP7VNthyto/gviz/tq?tqx=out:json";
    let currentDayName = '월';
    let mealDateOffset = 0; // 0=오늘, -1=어제, 1=내일

    /* -------------------------------------------------------------------------
       유틸리티 함수
       ------------------------------------------------------------------------- */
    // 선생님 호칭 자동 완성 함수 (이름만 있으면 ' 선생님' 추가)
    function formatTeacher(name) {
      if (!name) return "";
      name = name.trim();
      if (name === "" || name === "급식실" || name === "자율" || name.includes("선생님") || name.includes("교사")) {
        return name;
      }
      return name + " 선생님";
    }

    // 선생님이 원하셨던 다크네이비 솔리드 카드 디자인 (왼쪽 두꺼운 띠)
    function buildClassCard(period, subject, teacher, isAfterschool = false) {
      const borderColor = isAfterschool ? 'border-amber-400' : 'border-sky-400';
      const periodColor = isAfterschool ? 'text-amber-400' : 'text-sky-400';

      return `
        <div class="flex items-center justify-between bg-[#131B2F] p-3.5 px-4 rounded-xl border-l-[5px] ${borderColor} shadow-sm">
          <div class="flex items-center gap-4">
            <span class="${periodColor} font-bold w-12 text-center text-[15px] shrink-0">${period}교시</span>
            <span class="text-white font-bold text-[15px] leading-tight">${subject}</span>
          </div>
          <span class="text-slate-400 text-sm font-medium shrink-0 ml-4">${teacher}</span>
        </div>
      `;
    }

    function updateStatusBadge(id, text, bgClass, textClass) {
      const el = document.getElementById(id);
      if(el) {
        el.textContent = text;
        el.className = `px-2.5 py-1 rounded-md text-[11px] font-bold ${bgClass} ${textClass} border border-current/20`;
      }
    }

    /* -------------------------------------------------------------------------
       시계 및 요일 탭 관리
       ------------------------------------------------------------------------- */
    function updateClock() {
      const now = new Date();
      let h = String(now.getHours()).padStart(2, '0');
      let m = String(now.getMinutes()).padStart(2, '0');
      let s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
      
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      let y = now.getFullYear();
      let mo = String(now.getMonth() + 1).padStart(2, '0');
      let d = String(now.getDate()).padStart(2, '0');
      let dayName = days[now.getDay()];
      document.getElementById('date').innerHTML = `${y}.${mo}.${d} (${dayName})요일`;
    }
    setInterval(updateClock, 1000);

    function selectDay(dayName) {
      currentDayName = dayName;
      document.querySelectorAll('.day-tab').forEach(btn => {
        btn.className = "day-tab w-10 py-1.5 rounded-lg text-sm font-bold text-slate-400 hover:text-white hover:bg-slate-700 transition";
      });
      const selectedBtn = document.getElementById(`tab-${dayName}`);
      if(selectedBtn) {
        selectedBtn.className = "day-tab w-10 py-1.5 rounded-lg text-sm font-bold text-white bg-sky-500 shadow-md";
      }
      
      loadRegularTimetable(dayName);
      loadAfterschoolTimetable(dayName);
    }

    /* -------------------------------------------------------------------------
       1. 정규 수업 로드 (JSON 기반 3중 방어 파싱)
       ------------------------------------------------------------------------- */
    async function loadRegularTimetable(dayName) {
      document.getElementById('regular-timetable-list').innerHTML = `<div class="text-center text-slate-500 text-sm py-10"><i class="fa-solid fa-spinner fa-spin mr-2"></i>시간표 불러오는 중...</div>`;
      
      try {
        const res = await fetch(GOOGLE_SHEET_URL);
        const text = await res.text();
        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonStr);
        const rows = data.table.rows;

        let headerRow = -1;
        let colIdx = -1;

        // [중요] 1. '금속' 등 글자 포함 오류 방지를 위해 정확히 일치(===)하는 열만 찾기
        for (let r = 0; r < Math.min(rows.length, 5); r++) {
          if (!rows[r] || !rows[r].c) continue;
          for (let c = 0; c < rows[r].c.length; c++) {
            let cell = rows[r].c[c];
            if (cell && (cell.v || cell.f)) {
              let val = String(cell.v || cell.f).replace(/\s+/g, ''); // 공백 제거
              // 정확한 일치 검사!
              if (val === dayName || val === dayName + '요일') {
                headerRow = r;
                colIdx = c;
                break;
              }
            }
          }
          if (colIdx !== -1) break;
        }

        // 헤더를 못 찾았을 경우 A열~E열 강제 매핑
        if (colIdx === -1) {
          const fallback = {'월':0, '화':1, '수':2, '목':3, '금':4}; // 0부터 시작
          colIdx = fallback[dayName] !== undefined ? fallback[dayName] : 0;
          headerRow = 0;
        }

        // 2. A열을 뒤져서 '1교시'가 시작되는 진짜 첫 번째 줄 찾기
        let startRow = headerRow + 1;
        for (let r = headerRow + 1; r < Math.min(rows.length, headerRow + 5); r++) {
          if(rows[r] && rows[r].c && rows[r].c[0]) {
            let val = String(rows[r].c[0].v || '').replace(/\s+/g, '');
            if(val.includes('1교시') || val === '1') {
              startRow = r;
              break;
            }
          }
        }

        let html = '';
        let hasData = false;
        
        // 3. 1교시부터 7교시까지 순차적으로 긁어오기
        for (let period = 1; period <= 7; period++) {
          let rowIdx = startRow + period - 1;
          if (rowIdx < rows.length && rows[rowIdx] && rows[rowIdx].c) {
            if (colIdx < rows[rowIdx].c.length) {
              let cell = rows[rowIdx].c[colIdx];
              if (cell && (cell.v || cell.f)) {
                let val = String(cell.v || cell.f).trim();
                
                // [중요] 가짜 수업(자율, 창체, 하이픈) 완벽 차단!
                if (val && !val.includes('자율') && !val.includes('창체') && val !== '-') {
                  let subject = val;
                  let teacher = "";
                  if (subject.includes("(")) {
                    let parts = subject.split("(");
                    subject = parts[0].trim();
                    teacher = formatTeacher(parts[1].replace(")", "").trim());
                  }
                  html += buildClassCard(period, subject, teacher, false);
                  hasData = true;
                }
              }
            }
          }
        }
        
        if(hasData) {
          document.getElementById('regular-timetable-list').innerHTML = html;
          updateStatusBadge('regular-status', '저장된 시간표', 'bg-amber-500/20', 'text-amber-400');
        } else {
          document.getElementById('regular-timetable-list').innerHTML = `<div class="p-4 rounded-xl text-center text-sm font-bold text-slate-400 bg-slate-900/50 border border-slate-700/50">등록된 수업이 없습니다.</div>`;
          updateStatusBadge('regular-status', '데이터 없음', 'bg-slate-700', 'text-slate-400');
        }
      } catch (e) {
        document.getElementById('regular-timetable-list').innerHTML = `<div class="text-rose-400 text-sm py-4 text-center font-bold">시간표를 불러오지 못했습니다. 시트 접근 권한을 확인하세요.</div>`;
        updateStatusBadge('regular-status', '연결 실패', 'bg-rose-500/20', 'text-rose-400');
      }
    }

    /* -------------------------------------------------------------------------
       2. 방과후학교 로드 (금요일 6~8교시 격주 완벽 지원)
       ------------------------------------------------------------------------- */
    async function loadAfterschoolTimetable(dayName) {
      if (dayName === '월') {
        document.getElementById('afterschool-timetable-list').innerHTML = buildClassCard(8, "TOEIC / 한국사", formatTeacher("지도교사"), true);
        updateStatusBadge('afterschool-status', '월요일 고정', 'bg-indigo-500/20', 'text-indigo-400');
        return;
      }

      try {
        const res = await fetch(GOOGLE_SHEET_URL);
        const text = await res.text();
        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonStr);
        const rows = data.table.rows;

        let html = '';
        let hasData = false;

        // 금요일 격주(주차별) 방과후 로직 적용!
        if (dayName === '금') {
          let todayDate = new Date();
          // 이번 달의 몇 주차인지 계산 (1일~7일: 1주차)
          let weekOfMonth = Math.ceil(todayDate.getDate() / 7);
          if(weekOfMonth > 5) weekOfMonth = 5;
          
          // 공식: 1주(9행), 2주(25행), 3주(41행), 4주(57행), 5주(73행)
          let startRowIdx = 9 + (weekOfMonth - 1) * 16; 
          
          // 금요일 열 인덱스 정확히 찾기 (금속 방지)
          let colIdx = -1;
          for(let c = 0; c < rows[0].c.length; c++) {
            if(rows[0].c[c] && rows[0].c[c].v) {
              let val = String(rows[0].c[c].v).replace(/\s+/g,'');
              if(val === '금' || val === '금요일') { colIdx = c; break; }
            }
          }
          if(colIdx === -1) colIdx = 4; // 기본값 E열

          // 6교시 칸(startRowIdx)에 실제 수업 데이터가 있는지 검사 (자율 제외)
          if (startRowIdx < rows.length && rows[startRowIdx] && rows[startRowIdx].c[colIdx]) {
             let val6 = String(rows[startRowIdx].c[colIdx].v || '').trim();
             
             if (val6 && !val6.includes('자율') && !val6.includes('창체')) {
                 // 6교시 데이터가 존재하므로 6,7,8교시 연속 출력
                 for (let i = 0; i < 3; i++) {
                     let r = startRowIdx + i;
                     if (r < rows.length && rows[r] && rows[r].c[colIdx]) {
                         let subject = String(rows[r].c[colIdx].v || '').trim();
                         // 빈칸 및 자율 제외
                         if (subject && !subject.includes('자율') && !subject.includes('창체')) {
                             html += buildClassCard(6 + i, subject, formatTeacher("지도교사"), true);
                             hasData = true;
                         }
                     }
                 }
             }
          }

          if (!hasData) {
            html = `<div class="p-4 rounded-xl text-center text-sm font-bold text-slate-400 bg-slate-900/50 border border-slate-700/50">수업 없음 (방과후 미운영)</div>`;
          }
          document.getElementById('afterschool-timetable-list').innerHTML = html;
          updateStatusBadge('afterschool-status', `${weekOfMonth}주차 방과후`, 'bg-amber-500/20', 'text-amber-400');
        
        } else {
          // 화, 수, 목 일반 방과후 로직
          let colIdx = -1;
          for (let c = 0; c < rows[0].c.length; c++) {
            let val = rows[0].c[c] ? String(rows[0].c[c].v||'').replace(/\s+/g,'') : '';
            if (val === dayName || val === dayName+'요일') { colIdx = c; break; }
          }
          
          if (colIdx !== -1) {
            for (let r = 8; r <= 11; r++) {
              if (r < rows.length && rows[r] && rows[r].c[colIdx]) {
                let val = String(rows[r].c[colIdx].v||'').trim();
                if (val && !val.includes('자율') && !val.includes('창체')) {
                  html += buildClassCard(r, val, formatTeacher("지도교사"), true);
                  hasData = true;
                }
              }
            }
          }
          
          if(hasData) {
            document.getElementById('afterschool-timetable-list').innerHTML = html;
          } else {
            document.getElementById('afterschool-timetable-list').innerHTML = `<div class="p-4 rounded-xl text-center text-sm font-bold text-slate-400 bg-slate-900/50 border border-slate-700/50">등록된 방과후가 없습니다.</div>`;
          }
        }
      } catch(e) {
        document.getElementById('afterschool-timetable-list').innerHTML = `<div class="text-rose-400 text-sm py-4 text-center">데이터를 불러오지 못했습니다.</div>`;
      }
    }

    /* -------------------------------------------------------------------------
       3. 교육부 NEIS 급식 로드 (선생님 요청 디자인 유지)
       ------------------------------------------------------------------------- */
    function resetMealDate() { mealDateOffset = 0; loadMeal(); }
    function changeMealDate(offset) { mealDateOffset += offset; loadMeal(); }
    
    async function loadMeal() {
      const targetDate = new Date();
      targetDate.setDate(targetDate.getDate() + mealDateOffset);
      
      const yyyy = targetDate.getFullYear();
      const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
      const dd = String(targetDate.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}${mm}${dd}`;
      
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const displayStr = `${yyyy}.${mm}.${dd} (${days[targetDate.getDay()]})`;
      document.getElementById('meal-date-display').textContent = displayStr;
      document.getElementById('meal-content').innerHTML = `<div class="text-center text-slate-500 text-sm py-10"><i class="fa-solid fa-spinner fa-spin mr-2"></i>급식 정보를 가져오는 중...</div>`;

      try {
        const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=10&ATPT_OFCDC_SC_CODE=K10&SD_SCHUL_CODE=7801228&MLSV_YMD=${dateStr}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.mealServiceDietInfo && data.mealServiceDietInfo[1].row) {
          let html = '';
          data.mealServiceDietInfo[1].row.forEach(meal => {
            let mealType = meal.MMEAL_SC_NM;
            let icon = mealType.includes("중식") ? "☀️ text-amber-400" : (mealType.includes("석식") ? "🌙 text-indigo-400" : "🌅 text-emerald-400");
            
            // 알러지 번호 및 특수문자 제거, 줄바꿈 처리
            let menuClean = meal.DDISH_NM.replace(/[0-9.]/g, '').replace(/\*/g, '').replace(/<br\/>/g, '<br>');
            
            html += `
              <div class="bg-[#131B2F] p-4 rounded-xl border border-slate-700/50 shadow-sm">
                <div class="text-xs font-black text-white mb-2.5 flex items-center gap-1.5">
                  <span class="${icon.split(' ')[1]}">${icon.split(' ')[0]}</span> ${mealType}
                </div>
                <div class="text-sm text-slate-300 leading-relaxed font-medium pl-1">
                  ${menuClean}
                </div>
              </div>
            `;
          });
          document.getElementById('meal-content').innerHTML = html;
        } else {
          document.getElementById('meal-content').innerHTML = `<div class="bg-slate-900/50 p-6 rounded-xl text-center text-slate-400 font-bold border border-slate-700/50 mt-4">이 날은 급식 정보가 없습니다.</div>`;
        }
      } catch (e) {
        document.getElementById('meal-content').innerHTML = `<div class="text-rose-400 text-sm py-4 text-center">급식 서버에 연결할 수 없습니다.</div>`;
      }
    }

    /* -------------------------------------------------------------------------
       4. 공지사항 / 주요 일정 (헤더 출력 완벽 차단)
       ------------------------------------------------------------------------- */
    async function fetchNotices() {
      try {
        const res = await fetch(GOOGLE_SHEET_URL);
        const text = await res.text();
        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonStr);
        const rows = data.table.rows;
        
        let html = '';
        // r=1부터 시작하여 1행(헤더) 기본 제외. 추가로 type명 검증.
        for (let r = 1; r < rows.length; r++) {
          if (rows[r] && rows[r].c && rows[r].c[0]) {
            let type = String(rows[r].c[0].v || '').trim();
            let content = rows[r].c[1] ? String(rows[r].c[1].v || '').trim() : '';
            
            // [핵심] 헤더 텍스트(type, 구분, 내용 등) 필터링
            if (!type || type.toLowerCase() === 'type' || type === '구분' || type === '분류') continue;
            
            if (content) {
              let badgeColor = type.includes("중요") ? "bg-rose-500/20 text-rose-400 border-rose-500/30" : "bg-sky-500/20 text-sky-400 border-sky-500/30";
              html += `
                <div class="bg-[#131B2F] p-3 rounded-xl flex items-center gap-3 border border-slate-700/50 shadow-sm">
                  <span class="px-2 py-1 text-[11px] font-black rounded border ${badgeColor} shrink-0">${type}</span>
                  <span class="text-[14px] font-medium text-slate-200">${content}</span>
                </div>
              `;
            }
          }
        }
        document.getElementById('notice-list').innerHTML = html || `<div class="text-slate-500 text-sm text-center py-2">등록된 공지사항이 없습니다.</div>`;
      } catch(e) { }
    }

    async function fetchDDays() {
      try {
        const res = await fetch(GOOGLE_SHEET_URL);
        const text = await res.text();
        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonStr);
        const rows = data.table.rows;
        
        let html = '';
        for (let r = 1; r < rows.length; r++) {
          if (rows[r] && rows[r].c && rows[r].c.length > 3 && rows[r].c[2] && rows[r].c[3]) {
             let title = String(rows[r].c[2].v || '').trim();
             let dateVal = String(rows[r].c[3].v || '').trim();
             
             // [핵심] 헤더 텍스트 필터링
             if (!title || title.toLowerCase() === 'title' || title === '제목' || title === '일정') continue;
             
             if(dateVal) {
                html += `
                  <div class="bg-[#131B2F] p-3 rounded-xl flex items-center justify-between border-l-[4px] border-amber-400 shadow-sm mb-2">
                    <div>
                      <div class="text-sm font-bold text-white">${title}</div>
                      <div class="text-xs text-slate-400 mt-1">${dateVal}</div>
                    </div>
                    <span class="px-2.5 py-1 bg-amber-500/20 text-amber-400 text-xs font-black rounded border border-amber-500/30">확인</span>
                  </div>
                `;
             }
          }
        }
        if(!html) {
           html = `<div class="text-slate-500 text-sm text-center py-2">등록된 일정이 없습니다.</div>`;
        }
        document.getElementById('dday-list').innerHTML = html;
      } catch(e) { }
    }

    /* -------------------------------------------------------------------------
       초기 실행 (오늘 날짜 탭 자동 선택)
       ------------------------------------------------------------------------- */
    window.onload = function() {
      updateClock();
      
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      let todayName = days[new Date().getDay()];
      if (todayName === '일' || todayName === '토') todayName = '월'; // 주말엔 월요일 표시
      
      // 첫 접속 시 오늘 요일 자동 포커스
      selectDay(todayName);
      
      loadMeal();
      fetchNotices();
      fetchDDays();
    };
  </script>
</body>
</html>
