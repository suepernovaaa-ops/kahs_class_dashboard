<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국항공고등학교 2학년 2반 스마트 대시보드</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            skyDark: '#0B132B',
            panelBg: 'rgba(26, 38, 57, 0.75)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #0B132B;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(251, 191, 36, 0.08) 0px, transparent 50%);
      color: #F8FAFC;
      min-height: 100vh;
      user-select: none;
    }

    .glass-panel {
      background: rgba(26, 38, 57, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .glass-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .active-day-btn {
      background: rgba(56, 189, 248, 0.2) !important;
      color: #38BDF8 !important;
      border-color: rgba(56, 189, 248, 0.4) !important;
      font-weight: 800;
    }

    .modal-backdrop {
      background: rgba(11, 19, 43, 0.85);
      backdrop-filter: blur(8px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body class="py-6 pl-[250px] pr-[130px] flex flex-col min-h-screen justify-between">

  <!-- Header Area -->
  <header class="glass-panel px-6 py-4 flex flex-wrap items-center justify-between gap-4 mb-5">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl bg-sky-500/15 border border-sky-400/30 flex items-center justify-center text-3xl shadow-lg shadow-sky-950/40">
        ✈️
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-xl md:text-2xl font-black text-sky-400 tracking-tight">한국항공고등학교 <span class="text-white">2학년 2반</span></h1>
          <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold border border-emerald-500/30 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 라이브
          </span>
        </div>
        <p class="text-xs md:text-sm text-slate-400 font-medium mt-0.5">[자·똥·자·치] 자기가 싼 똥은 자기가 치우자!</p>
      </div>
    </div>

    <!-- Right Clock & Quick Tools -->
    <div class="flex items-center gap-5">
      <div class="text-right">
        <div class="text-2xl md:text-3xl font-black text-white font-mono tracking-tight" id="clock-time">00:00:00</div>
        <div class="text-xs text-slate-400 font-bold" id="clock-date">로딩 중...</div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openModal('alert-history-modal')" id="alert-history-btn" title="알림 내역" class="relative p-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-300 hover:text-rose-400 hover:border-rose-400/50 transition">
          <i class="fa-solid fa-bell"></i>
          <span id="alert-red-dot" class="absolute -top-1 -right-1 w-3 h-3 bg-rose-500 rounded-full border-2 border-slate-900 hidden animate-pulse"></span>
        </button>
        <button onclick="toggleAudioChime()" id="chime-btn" title="수업 종소리 알림 토글" class="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-300 hover:text-amber-400 hover:border-amber-400/50 transition">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <button onclick="toggleFullscreen()" title="전체화면 (TV / 모니터용)" class="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-300 hover:text-emerald-400 hover:border-emerald-400/50 transition">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- LIVE CLASS STATUS BAR -->
  <div class="glass-panel px-5 py-3 mb-5 flex flex-wrap items-center justify-between gap-3 border-l-4 border-l-sky-400">
    <div class="flex flex-wrap items-center gap-3">
      <span class="px-2.5 py-1 rounded-lg bg-sky-500/20 text-sky-300 text-xs font-black uppercase tracking-wider border border-sky-500/30">
        LIVE CLASS STATUS
      </span>
      <span id="active-period-badge" class="text-xs md:text-sm font-extrabold text-white bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
        일과 분석 중...
      </span>
      <div class="flex items-center gap-2 text-sm md:text-base font-black text-sky-200 ml-1" id="live-subject-info">
        <i class="fa-solid fa-book-bookmark text-sky-400"></i>
        <span id="live-subject-title">수업 정보 불러오는 중...</span>
      </div>
    </div>

    <!-- Day Selector Buttons -->
    <div class="flex items-center gap-1.5" id="header-day-tabs">
      <span class="text-xs text-slate-400 font-bold mr-1 hidden sm:inline"><i class="fa-solid fa-calendar-day mr-1 text-sky-400"></i>요일선택:</span>
      <button onclick="selectDay('월')" class="day-tab-btn px-3 py-1.5 text-xs rounded-lg bg-slate-800/80 border border-slate-700 font-bold text-slate-300 hover:text-white hover:border-sky-400/50 transition">월</button>
      <button onclick="selectDay('화')" class="day-tab-btn px-3 py-1.5 text-xs rounded-lg bg-slate-800/80 border border-slate-700 font-bold text-slate-300 hover:text-white hover:border-sky-400/50 transition">화</button>
      <button onclick="selectDay('수')" class="day-tab-btn px-3 py-1.5 text-xs rounded-lg bg-slate-800/80 border border-slate-700 font-bold text-slate-300 hover:text-white hover:border-sky-400/50 transition">수</button>
      <button onclick="selectDay('목')" class="day-tab-btn px-3 py-1.5 text-xs rounded-lg bg-slate-800/80 border border-slate-700 font-bold text-slate-300 hover:text-white hover:border-sky-400/50 transition">목</button>
      <button onclick="selectDay('금')" class="day-tab-btn px-3 py-1.5 text-xs rounded-lg bg-slate-800/80 border border-slate-700 font-bold text-slate-300 hover:text-white hover:border-sky-400/50 transition">금</button>
      <button onclick="selectDay('토')" class="day-tab-btn px-3 py-1.5 text-xs rounded-lg bg-slate-800/80 border border-slate-700 font-bold text-slate-300 hover:text-white hover:border-sky-400/50 transition">토</button>
    </div>
  </div>

  <!-- Main Grid Layout (3 Columns) -->
  <main class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-5 flex-1">
    
    <!-- CARD 1: Regular Timetable -->
    <div class="glass-panel p-5 flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-700/80">
          <div class="flex items-center gap-2 text-sky-400 font-bold text-lg">
            <span>📅</span> 정규 수업
          </div>
          <div class="flex items-center gap-2">
            <span id="timetable-source-badge" class="text-[11px] px-2 py-0.5 rounded font-bold bg-slate-700 text-slate-300">
              로딩 중...
            </span>
          </div>
        </div>
        <div class="space-y-2 overflow-y-auto max-h-[420px] pr-1" id="regular-timetable-container">
          <div class="text-center py-10 text-slate-500 text-xs">시간표 데이터를
