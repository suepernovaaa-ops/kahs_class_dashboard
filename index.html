    // CSV Parsing Helper
    function parseCSV(text) {
      let p = '', row = [''], ret = [row], i = 0, r = 0, s = true, l;
      for (let idx = 0; idx < text.length; idx++) {
        l = text[idx];
        if ('"' === l) {
          if (s && l === p) row[i] += l;
          s = !s;
        } else if (',' === l && s) { l = row[++i] = ''; }
        else if ('\n' === l && s) {
          if ('\r' === p) row[i] = row[i].slice(0, -1);
          row = [l = '']; ret[++r] = row; i = 0;
        } else { row[i] += l; }
        p = l;
      }
      return ret;
    }

    // Teacher Name Formatter
    function formatTeacher(name) {
      if (!name) return '';
      let t = String(name).trim();
      if (t !== '' && !t.endsWith('선생님') && !t.endsWith('교사') && t !== '급식실' && t !== '지도교사' && !t.includes('방과후')) {
        return t + ' 선생님';
      }
      return t;
    }

    function splitSubjectAndTeacher(rawText) {
      if (!rawText) return { subject: '', teacher: '' };
      let text = String(rawText).trim();
      let parts = text.split(/\s+/);
      if (parts.length >= 2) {
        let teacher = parts.pop();
        let subject = parts.join(' ');
        return { subject: subject, teacher: formatTeacher(teacher) };
      }
      return { subject: text, teacher: '' };
    }

    async function loadRegularTimetable() {
      const badge = document.getElementById('timetable-source-badge');
      if (badge) {
        badge.innerText = "로딩 중...";
        badge.className = "text-[11px] px-2 py-0.5 rounded font-bold bg-slate-700 text-slate-300";

      // 1. Python Server (Comci)
      try {

        if (res.ok) {
          const json = await res.json();
          if (json.success && json.data) {
            parseComciPayload(json.data);
            if (badge) {
              badge.innerText = "컴시간알리미";
              badge.className = "text-[11px] px-2 py-0.5 rounded font-bold bg-sky-500/20 text-sky-300 border border-sky-500/30";

            renderTimetables();
            return;
          }
        }
      } catch (e) {}
      
      // 2. NEIS
      try {
        const now = new Date();
        const monday = new Date(now);
        monday.setDate(now.getDate() - (now.getDay() || 7) + 1);
        const friday = new Date(monday);
        friday.setDate(monday.getDate() + 4);

        const fromYmd = monday.getFullYear() + String(monday.getMonth() + 1).padStart(2, '0') + String(monday.getDate()).padStart(2, '0');
        const toYmd = friday.getFullYear() + String(friday.getMonth() + 1).padStart(2, '0') + String(friday.getDate()).padStart(2, '0');

        const neisUrl = `https://open.neis.go.kr/hub/hisTimetable?Type=json&ATPT_OFCDC_SC_CODE=K10&SD_SCHUL_CODE=7801228&AY=${now.getFullYear()}&SEM=2&GRADE=2&CLASS_NM=2&TI_FROM_YMD=${fromYmd}&TI_TO_YMD=${toYmd}`;
        
        const neisRes = await fetch(neisUrl);
        if (neisRes.ok) {
          const json = await neisRes.json();
          if (json.hisTimetable && json.hisTimetable[1].row) {
            parseNeisTimetable(json.hisTimetable[1].row);
            if (badge) {
              badge.innerText = "NEIS 연동";
              badge.className = "text-[11px] px-2 py-0.5 rounded font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
            }
            renderTimetables();
            return;
          }
        }
      } catch (e) {}

      // 3. Google Sheets Fallback
      try {
        const sheetRes = await fetch(SHEET_URL_REGULAR + '&_nocache=' + Date.now());
        if (sheetRes.ok) {
          const text = await sheetRes.text();
          parseRegularSheet(text);
          if (badge) {
            badge.innerText = "저장된 시간표";
            badge.className = "text-[11px] px-2 py-0.5 rounded font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30";
          }
          renderTimetables();
        }
      } catch (e) {
        if (badge) {
          badge.innerText = "연결 실패";
          badge.className = "text-[11px] px-2 py-0.5 rounded font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30";
        }
      }
    }

    function parseComciPayload(dataObj) {
      const dayMap = { 1: '월', 2: '화', 3: '수', 4: '목', 5: '금' };
      regularTimetableData = { '월': [], '화': [], '수': [], '목': [], '금': [], '토': [] };
      for (let d = 1; d <= 5; d++) {
        let dayList = dataObj[d] || dataObj[String(d)] || [];
        dayList.forEach((item, idx) => {
          if (item.subject) {
            regularTimetableData[dayMap[d]].push({ 
              period: item.period || (idx + 1), 
              subject: item.subject, 
              teacher: formatTeacher(item.teacher)
            });
          }
        });
      }
    }

    function parseNeisTimetable(rows) {
      const dayMap = { 1: '월', 2: '화', 3: '수', 4: '목', 5: '금' };
      regularTimetableData = { '월': [], '화': [], '수': [], '목': [], '금': [], '토': [] };
      rows.forEach(r => {
        let ymd = r.ALL_TI_YMD;
        if (ymd && r.ITRT_CNT && r.ITRT_CNT_NM) {
          let dateObj = new Date(ymd.substring(0, 4), parseInt(ymd.substring(4, 6)) - 1, ymd.substring(6, 8));
          let dayIndex = dateObj.getDay();
          let parsed = splitSubjectAndTeacher(r.ITRT_CNT_NM);
          if (dayIndex >= 1 && dayIndex <= 5 && parsed.subject) {
            regularTimetableData[dayMap[dayIndex]].push({ period: parseInt(r.ITRT_CNT), subject: parsed.subject, teacher: parsed.teacher });
          }
        }
      });
      for (let d = 1; d <= 5; d++) {
        regularTimetableData[dayMap[d]].sort((a, b) => a.period - b.period);
      }
    }

    function parseRegularSheet(csvText) {
      const rows = parseCSV(csvText);
      const dayMap = { 1: '월', 2: '화', 3: '수', 4: '목', 5: '금' };
      regularTimetableData = { '월': [], '화': [], '수': [], '목': [], '금': [], '토': [] };
      
      let foundHeaderRow = -1;
      for (let r = 0; r < rows.length; r++) {
        let line = rows[r].join(',');
        if (line.includes('월') && line.includes('화')) { foundHeaderRow = r; break; }
      }
      if (foundHeaderRow !== -1) {
        for (let p = 1; p <= 7; p++) {
          let rIdx = foundHeaderRow + p;
          if (rows[rIdx]) {
            for (let d = 1; d <= 5; d++) {
              let val = rows[rIdx][d] ? rows[rIdx][d].trim() : '';
              if (val) {
                let parsed = splitSubjectAndTeacher(val);
                regularTimetableData[dayMap[d]].push({ period: p, subject: parsed.subject, teacher: parsed.teacher });
              }
            }
          }
        }
      }
    }

    async function fetchGoogleSheetsAfterschoolSchedule() {
      const currentMonth = currentDateForMeal.getMonth() + 1;
      const monthSheetName = `${currentMonth}월`;
      const sheetId = '13_kWSLwjIynNBEfQAfw2sQkkBBN5Zy9aqvWIOe7bmg4';
      const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=0&sheet=${encodeURIComponent(monthSheetName)}`;

      afterschoolTimetableData = { '월': [], '화': [], '수': [], '목': [], '금': [], '토': [] };

      // 월요일 고정 방과후
      afterschoolTimetableData['월'] = [
        { period: 8, subject: 'TOEIC/한국사', teacher: '' },
        { period: 9, subject: 'TOEIC/한국사', teacher: '' },
        { period: 10, subject: 'TOEIC/한국사', teacher: '' },
        { period: 11, subject: 'TOEIC/한국사', teacher: '' }
      ];

      try {
        const res = await fetch(gvizUrl);
        const text = await res.text();
        const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
        if (!jsonMatch) return;
        const data = JSON.parse(jsonMatch[1]);
        const rows = data.table.rows;

        const dom = currentDateForMeal.getDate();
        const weekIdx = Math.min(Math.ceil(dom / 7), 5);

        const weekRowOffsets = {
          1: [11, 13, 14, 15], 2: [27, 29, 30, 31],
          3: [43, 45, 46, 47], 4: [59, 61, 62, 63], 5: [75, 77, 78, 79]
        };
        const targetRows = weekRowOffsets[weekIdx] || weekRowOffsets[4];
        
        // 화(O=14), 수(X=23), 목(AG=32), 금(AP=41)
        const dayCols = { '화': 14, '수': 23, '목': 32, '금': 41 };

        ['화', '수', '목', '금'].forEach(day => {
          const colIdx = dayCols[day];
          const daySchedule = [];
          [8, 9, 10, 11].forEach((period, pIdx) => {
            const rowIdx = targetRows[pIdx];
            let val = "";
            try {
              if (rows[rowIdx] && rows[rowIdx].c && rows[rowIdx].c[colIdx]) {
                const cell = rows[rowIdx].c[colIdx];
                val = cell.f || cell.v || "";
              }
            } catch (e) { val = ""; }

            let subject = val ? val.toString().trim() : "";
            let teacher = "";
            if (subject.includes('\n')) {
              const parts = subject.split('\n');
              subject = parts[0].trim();
              teacher = parts.slice(1).join(' ').trim();
            } else if (subject.includes('(') && subject.includes(')')) {
              const match = subject.match(/(.*?)\((.*?)\)/);
              if (match) { subject = match[1].trim(); teacher = match[2].trim(); }
            }
            if (!subject) subject = "수업 없음";
            
            daySchedule.push({ period, subject, teacher: formatTeacher(teacher) });
          });
          afterschoolTimetableData[day] = daySchedule;
        });

        // 토요일 파싱 (AY=50)
        const satWeekRowOffsets = {
          1: [3, 4, 5, 6, 8, 9, 10, 11],
          2: [19, 20, 21, 22, 24, 25, 26, 27],
          3: [35, 36, 37, 38, 40, 41, 42, 43],
          4: [51, 52, 53, 54, 56, 57, 58, 59],
          5: [67, 68, 69, 70, 72, 73, 74, 75]
        };
        const satRows = satWeekRowOffsets[weekIdx] || satWeekRowOffsets[4];
        const satSchedule = [];
        satRows.forEach((rowIdx, pIdx) => {
          const period = pIdx + 1;
          let val = "";
          try {
            if (rows[rowIdx] && rows[rowIdx].c && rows[rowIdx].c[50]) {
              const cell = rows[rowIdx].c[50];
              val = (cell.f || cell.v || "").toString().trim();
            }
          } catch(e) { val = ""; }

          let subject = val;
          let teacher = "";
          if (subject.includes('\n')) {
            const parts = subject.split('\n');
            subject = parts[0].trim();
            teacher = parts.slice(1).join(' ').trim();
          } else if (subject.includes('(') && subject.includes(')')) {
            const match = subject.match(/(.*?)\((.*?)\)/);
            if (match) { subject = match[1].trim(); teacher = match[2].trim(); }
          }
          if (!subject) subject = "수업 없음";
          satSchedule.push({ period, subject, teacher: formatTeacher(teacher) });
        });
        afterschoolTimetableData['토'] = satSchedule;

      } catch (err) {}

      renderTimetables();
    }

    async function pollGoogleSheetAlerts() {
      try {
        const res = await fetch(SHEET_URL_ALERT + '&_nocache=' + Date.now());
        if (res.ok) {
          const text = await res.text();
          const rows = parseCSV(text);
          if (rows.length >= 2) {
            const activeVal = (rows[1][0] || '').trim().toUpperCase();
            const isActive = (activeVal === 'TRUE' || activeVal === '1' || activeVal === 'Y');
            const title = rows[1][1] || '교무실 긴급 전달사항';
            const message = rows[1][2] || '';
            const alertKey = title + '::' + message;

            const modal = document.getElementById('emergency-alert-modal');
            if (isActive && message.trim() !== '') {
              if (lastDismissedAlertText !== alertKey) {
                document.getElementById('emergency-sender').innerText = title;
                document.getElementById('emergency-content').innerText = message;
                modal.classList.remove('hidden');
              }
            } else {
              modal.classList.add('hidden');
              lastDismissedAlertText = '';
            }
          }
        }
      } catch (e) {}
      setTimeout(pollGoogleSheetAlerts, 5000);
    }

    function closeModal(id) {
      if (id === 'emergency-alert-modal') {
        const title = document.getElementById('emergency-sender').innerText;
        const message = document.getElementById('emergency-content').innerText;
        lastDismissedAlertText = title + '::' + message;
      }
      document.getElementById(id).classList.add('hidden');
    }

    function updateClock() {
      const now = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const clockEl = document.getElementById('clock-time');
      if (clockEl) clockEl.textContent = `${hours}:${minutes}:${seconds}`;

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const dayName = days[now.getDay()];
      
      const dateEl = document.getElementById('clock-date');
      if (dateEl) dateEl.textContent = `${year}.${month}.${date} (${dayName})요일`;

      updateLivePeriodStatus(now);
    }

    function updateLivePeriodStatus(now) {
      const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const dayIdx = now.getDay();
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const todayName = dayNames[dayIdx];

      const badge = document.getElementById('active-period-badge');
      const info = document.getElementById('live-subject-title');

      if (!badge || !info) return;

      if (dayIdx === 0 || dayIdx === 6) {
        badge.textContent = "주말 휴무";
        info.textContent = "즐거운 주말 보내세요! ✈️";
        return;
      }

      let activeFound = false;
      for (let p of PERIOD_TIMINGS) {
        if (currentHM >= p.start && currentHM <= p.end) {
          activeFound = true;
          badge.textContent = `${p.label} (${p.start} ~ ${p.end})`;
          let subjectText = "", teacherText = "";

          if (p.type === "조례") { subjectText = "아침 조례 및 전달사항 확인"; teacherText = "담임 선생님"; }
          else if (p.type === "점심") { subjectText = "즐거운 점심시간 🍱"; teacherText = "급식실"; }
          else if (p.type === "저녁") { subjectText = "저녁 식사시간 🌙"; teacherText = "급식실"; }
          else {
            const pNum = parseInt(p.type);
            if (pNum <= 7) {
              const item = (regularTimetableData[todayName] || []).find(i => i.period === pNum);
              if (item) { subjectText = item.subject; teacherText = item.teacher; }
            } else {
              const item = (afterschoolTimetableData[todayName] || []).find(i => i.period === pNum);
              if (item) { subjectText = item.subject; teacherText = item.teacher; }
            }
          }
          info.innerHTML = `<strong>${subjectText}</strong> ${teacherText ? `<span class="text-xs text-sky-400 font-normal ml-2">(${teacherText})</span>` : ''}`;
          break;
        }
      }

      if (!activeFound) {
        if (currentHM < "08:40") { badge.textContent = "등교 및 아침 자율시간"; info.textContent = "오늘 하루도 활기차게 시작하세요! ✈️"; }
        else if (currentHM > "21:00") { badge.textContent = "방과후 및 야간학습 종료"; info.textContent = "오늘 수업이 완료되었습니다."; }
        else { badge.textContent = "쉬는시간"; info.textContent = "다음 수업 교재를 준비해 주세요."; }
      }
    }

    function selectDay(dayName) {
      selectedDayName = dayName;

      const daysMap = { '일': 0, '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };
      const targetDayIdx = daysMap[dayName];
      const now = new Date();
      const currentDayIdx = now.getDay();
      const diff = targetDayIdx - currentDayIdx;
      
      currentDateForMeal = new Date();
      currentDateForMeal.setDate(now.getDate() + diff);

      document.querySelectorAll('.day-tab-btn').forEach(btn => {
        if (btn.textContent.trim() === dayName) {
          btn.classList.add('active-day-btn');
        } else {
          btn.classList.remove('active-day-btn');
        }
      });

      renderTimetables();
      fetchMealsForDate();
      fetchGoogleSheetsAfterschoolSchedule();
    }

    function renderTimetables() {
      const regContainer = document.getElementById('regular-timetable-container');
      const aftContainer = document.getElementById('afterschool-timetable-container');

      if (regContainer) {
        if (selectedDayName === '토') {
          regContainer.innerHTML = `
            <div class="p-6 text-center text-slate-400 glass-card">
              <i class="fa-solid fa-mug-hot text-2xl text-amber-400 mb-2"></i>
              <div class="font-bold text-sm text-slate-300">토요일은 정규 수업이 없습니다.</div>
            </div>
          `;
        } else {
          const regList = regularTimetableData[selectedDayName] || [];
          if (regList.length === 0) {
             regContainer.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">시간표 데이터를 불러오는 중입니다...</div>`;
          } else {
             regContainer.innerHTML = regList.map(item => `
              <div class="glass-card p-3 flex items-center justify-between border-l-4 border-l-sky-400 hover:bg-slate-800/60 transition">
                <span class="text-xs font-bold text-sky-300 w-14">${item.period}교시</span>
                <span class="text-sm font-extrabold text-white flex-1 mx-2">${item.subject}</span>
                <span class="text-xs text-slate-400">${item.teacher}</span>
              </div>
            `).join('');
          }
        }
      }

      if (aftContainer) {
        const aftList = afterschoolTimetableData[selectedDayName] || [];
        if (aftList.length === 0) {
           aftContainer.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">방과후 일정을 로딩 중입니다...</div>`;
        } else {
           aftContainer.innerHTML = aftList.map(item => `
            <div class="glass-card p-3 flex items-center justify-between border-l-4 border-l-amber-400 hover:bg-slate-800/60 transition">
              <span class="text-xs font-bold text-amber-300 w-14">${item.period}교시</span>
              <span class="text-sm font-extrabold text-white flex-1 mx-2">${item.subject}</span>
              <span class="text-xs text-slate-400">${item.teacher || ''}</span>
            </div>
          `).join('');
        }
      }
    }

    function fetchMealsForDate() {
      const year = currentDateForMeal.getFullYear();
      const month = String(currentDateForMeal.getMonth() + 1).padStart(2, '0');
      const date = String(currentDateForMeal.getDate()).padStart(2, '0');
      const ymd = `${year}${month}${date}`;

      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const dateDisplayEl = document.getElementById('meal-date-display');
      if (dateDisplayEl) {
        dateDisplayEl.textContent = `${year}.${month}.${date} (${days[currentDateForMeal.getDay()]})`;
      }

      const neisUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=10&ATPT_OFCDC_SC_CODE=K10&SD_SCHUL_CODE=7801228&MLSV_YMD=${ymd}`;

      fetch(neisUrl)
        .then(res => res.json())
        .then(data => {
          let mealData = { breakfast: "급식 정보 없음", lunch: "급식 정보 없음", dinner: "급식 정보 없음" };

          if (data.mealServiceDietInfo && data.mealServiceDietInfo[1] && data.mealServiceDietInfo[1].row) {
            const rows = data.mealServiceDietInfo[1].row;
            rows.forEach(r => {
              const cleanDish = r.DDISH_NM.replace(/<br\/>/g, '\n').replace(/\([0-9\.]+\)/g, '').trim();
              if (r.MMEAL_SC_CODE === '1') mealData.breakfast = cleanDish;
              if (r.MMEAL_SC_CODE === '2') mealData.lunch = cleanDish;
              if (r.MMEAL_SC_CODE === '3') mealData.dinner = cleanDish;
            });
          }
          renderMealCardsWithTiming(mealData);
        })
        .catch(err => {
          renderMealCardsWithTiming({ breakfast: "연동 실패", lunch: "연동 실패", dinner: "연동 실패" });
        });
    }

    function renderMealCardsWithTiming(meals) {
      const container = document.getElementById('meals-container');
      if (!container || !meals) return;

      const now = new Date();
      const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      const isToday = (currentDateForMeal.toDateString() === now.toDateString());
      const isBreakfastActive = isToday && (currentHM <= "08:40");
      const isLunchActive = isToday && (currentHM > "08:40" && currentHM <= "13:40");
      const isDinnerActive = isToday && (currentHM > "13:40" && currentHM <= "18:10");

      container.innerHTML = `
        <div class="glass-card p-3.5 border-l-4 transition-all duration-300 ${isBreakfastActive ? 'border-l-emerald-400 bg-emerald-950/40 border-emerald-500/30 shadow-lg ring-1 ring-emerald-500/20' : 'border-l-slate-600 opacity-85'}">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold ${isBreakfastActive ? 'text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-500/30' : 'text-slate-400'}">
              🌅 조식 ${isBreakfastActive ? '(진행 중)' : ''}
            </span>
          </div>
          <p class="text-xs font-medium text-slate-200 leading-relaxed whitespace-pre-line">${meals.breakfast}</p>
        </div>
        <div class="glass-card p-3.5 border-l-4 transition-all duration-300 ${isLunchActive ? 'border-l-emerald-400 bg-emerald-950/40 border-emerald-500/30 shadow-lg ring-1 ring-emerald-500/20' : 'border-l-slate-600 opacity-85'}">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold ${isLunchActive ? 'text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-500/30' : 'text-slate-400'}">
              ☀️ 중식 ${isLunchActive ? '(진행 중)' : ''}
            </span>
          </div>
          <p class="text-xs font-medium text-slate-200 leading-relaxed whitespace-pre-line">${meals.lunch}</p>
        </div>
        <div class="glass-card p-3.5 border-l-4 transition-all duration-300 ${isDinnerActive ? 'border-l-emerald-400 bg-emerald-950/40 border-emerald-500/30 shadow-lg ring-1 ring-emerald-500/20' : 'border-l-slate-600 opacity-85'}">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold ${isDinnerActive ? 'text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-500/30' : 'text-slate-400'}">
              🌙 석식 ${isDinnerActive ? '(진행 중)' : ''}
            </span>
          </div>
          <p class="text-xs font-medium text-slate-200 leading-relaxed whitespace-pre-line">${meals.dinner}</p>
        </div>
      `;
    }

    function changeMealDate(offset) {
      currentDateForMeal.setDate(currentDateForMeal.getDate() + offset);
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const targetDayName = dayNames[currentDateForMeal.getDay()];
      if (targetDayName !== '일') {
        selectDay(targetDayName);
      } else {
        fetchMealsForDate();
      }
    }

    function renderNotices() {
      const container = document.getElementById('notices-list');
      if (!container) return;
      if (notices.length === 0) {
        container.innerHTML = `<div class="text-xs text-slate-500 text-center py-4">등록된 공지사항이 없습니다.</div>`;
        return;
      }
      container.innerHTML = notices.map(item => `
        <div class="glass-card p-2.5 flex items-center justify-between text-xs mb-2">
          <div class="flex items-center gap-2 flex-1 mr-2">
            <span class="px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 font-bold border border-sky-500/30 shrink-0">${item.tag}</span>
            <span class="text-white font-medium truncate">${item.text}</span>
          </div>
        </div>
      `).join('');
    }

    function renderDDays() {
      const container = document.getElementById('ddays-list');
      if (!container) return;
      const today = new Date();
      today.setHours(0,0,0,0);
      if (ddays.length === 0) {
        container.innerHTML = `<div class="text-xs text-slate-500 text-center py-4">등록된 일정이 없습니다.</div>`;
        return;
      }
      container.innerHTML = ddays.map(item => {
        const target = new Date(item.date);
        target.setHours(0,0,0,0);
        const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        let dDayStr = diffDays === 0 ? "D-Day" : diffDays > 0 ? `D-${diffDays}` : `D+${Math.abs(diffDays)}`;
        return `
          <div class="glass-card p-3 flex items-center justify-between border-l-4 border-l-amber-400">
            <div>
              <div class="text-xs font-bold text-white">${item.title}</div>
              <div class="text-[10px] text-slate-400">${item.date}</div>
            </div>
            <span class="text-sm font-black text-amber-300 font-mono px-2 py-0.5 rounded bg-amber-500/20 border border-amber-500/30">${dDayStr}</span>
          </div>
        `;
      }).join('');
    }

    window.onload = function () {
      setInterval(updateClock, 1000);
      updateClock();

      // 오늘 요일로 자동 선택 (일요일은 월요일로)
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      let initDay = dayNames[new Date().getDay()];
      if (initDay === '일') initDay = '월';
      
      selectDay(initDay);

      // 데이터 실시간 로드
      loadRegularTimetable();
      fetchNotices();
      fetchDDays();
      pollGoogleSheetAlerts();
    };
  </script>
</body>
</html>
